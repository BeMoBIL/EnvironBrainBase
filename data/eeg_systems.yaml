# EEG Systems canonical lookup for EnviroBrainBase
#
# Each entry defines the canonical properties of an EEG system.
# The 'name' field must match the value used in the EEG_system column of papers.csv
# (case-insensitive lookup is used in the app).
#
# mobility_score scale (0-4):
#   0  All equipment off-body; participant tethered via cabling to EEG acquisition equipment
#   1  Waist-mounted (or back-mounted) amplifier with cables running to EEG cap
#   2  All equipment waist-mounted; wireless link to EEG cap
#   3  Head-mounted EEG system; additional equipment in rucksack or off-body
#   4  Fully head-mounted; wireless to smartphone / tablet only

